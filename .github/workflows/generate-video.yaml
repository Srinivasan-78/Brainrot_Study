name: Generate Study Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Study topic"
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Research
        env:
          TOPIC: ${{ inputs.topic }}
        run: python scripts/research.py

      - name: Generate script
        env:
          TOPIC: ${{ inputs.topic }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python scripts/script_gen.py

      - name: Generate voiceover
        run: python scripts/voice_gen.py

      - name: Assemble video
        run: python scripts/assemble.py

      - uses: actions/upload-artifact@v4
        with:
          name: study-video-${{ github.run_id }}
          path: build/output.mp4
          retention-days: 14
